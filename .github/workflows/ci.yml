name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the src/domain purity boundary rules — see eslint.config.mjs.
      - name: Lint
        run: npm run lint

      - name: Unit and property tests
        run: npm test

      - name: Build
        run: npm run build

      # The service-role key must never reach the browser. This catches the
      # mistake that a code review would not: a NEXT_PUBLIC_ prefix on a secret.
      - name: Client bundle must not contain server secrets
        run: |
          if grep -rEl 'SUPABASE_SERVICE_ROLE|STRIPE_SECRET_KEY|service_role' .next/static/ 2>/dev/null; then
            echo "::error::A server secret was found in the client bundle."
            exit 1
          fi
          echo "Client bundle clean."

  # Integration and concurrency suites arrive with increments 2 and 4.
  # They need a real Postgres service container, and they are kept in a
  # separate job so a slow database never blocks fast domain feedback.
