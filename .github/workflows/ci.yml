name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the src/domain purity boundary rules — see eslint.config.mjs.
      - name: Lint
        run: npm run lint

      - name: Unit and property tests
        run: npm test

      # Built with CANARY secret values, not real ones and not blanks.
      #
      # Next.js inlines every NEXT_PUBLIC_* reference as its VALUE at build
      # time, so the variable NAME never appears in the output — grepping for
      # names cannot detect a leak. Building with distinctive values and then
      # hunting for those values can. See scripts/scan-secrets.mjs.
      - name: Build (with canary secrets)
        run: npm run build
        env:
          SUPABASE_SERVICE_ROLE_KEY: cnry_service_role_MUST_NOT_SHIP
          STRIPE_SECRET_KEY: cnry_stripe_secret_MUST_NOT_SHIP
          STRIPE_WEBHOOK_SECRET: cnry_stripe_webhook_MUST_NOT_SHIP
          DATABASE_URL: cnry_database_url_MUST_NOT_SHIP
          DIRECT_DATABASE_URL: cnry_direct_db_MUST_NOT_SHIP
          TWILIO_AUTH_TOKEN: cnry_twilio_auth_MUST_NOT_SHIP
          RESEND_API_KEY: cnry_resend_MUST_NOT_SHIP
          NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY: cnry_public_service_role_MUST_NOT_SHIP
          NEXT_PUBLIC_STRIPE_SECRET_KEY: cnry_public_stripe_secret_MUST_NOT_SHIP

      # Build-artifact scan: catches leaks on prerendered routes.
      - name: No server secret in build output
        run: npm run scan:secrets

      # Request-time scan: starts the real production server and reads what
      # actually comes back over HTTP.
      #
      # Needed because dynamic routes — the admin console, every order route —
      # render per request and produce NO build artifact, so the scan above is
      # structurally blind to them. Demonstrated: a force-dynamic route leaking
      # a canary passed the build scan and was caught here.
      - name: No server secret in request-time responses
        run: npm run scan:runtime

  # ⭐ THE GATE. Separate job so a slow database never blocks the fast
  # pure-domain feedback above, and so a failure here is unmistakable in the
  # checks list rather than buried in one long log.
  #
  # If this job is not green, order placement is not done. It does not relax at
  # low volume: two customers racing for the last tray is a correctness bug at
  # 3 orders/day exactly as at 300 — just rarer, which is worse.
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Integration suites, then the concurrency gate. Both run against the
      # real service container above — there is no fake, because everything
      # they check (row locks, CHECK constraints, lock ordering, rollback) is a
      # property of PostgreSQL rather than of our code.
      #
      # The URL is passed explicitly. The local default is port 5433, chosen so
      # the harness — which runs DROP SCHEMA — cannot land on a developer's own
      # PostgreSQL on 5432. Here 5432 is the service container and is safe.
      - name: Integration and concurrency suites
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test:db
