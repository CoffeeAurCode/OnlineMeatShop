name: Database backup

# THIS IS THE ENTIRE BACKUP STRATEGY.
#
# Supabase's free tier takes no automatic backups of any kind — not daily, not
# point-in-time, none. There is no vendor copy to fall back on. If this
# workflow is broken, the database has no backup at all, and the way that is
# discovered is normally the way you least want to discover it.
#
# Stated recovery-point objective: 6 hours.

on:
  schedule:
    # Every 6 hours. GitHub's scheduler is best-effort and can run late under
    # load, which is one more reason the staleness alert below is not optional.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          BACKUP_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          missing=""
          for v in DIRECT_DATABASE_URL BACKUP_S3_BUCKET BACKUP_S3_ENDPOINT \
                   BACKUP_ACCESS_KEY_ID BACKUP_SECRET_ACCESS_KEY \
                   BACKUP_ENCRYPTION_PASSPHRASE; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Backups are NOT configured. Missing secrets:$missing"
            echo "Until these are set, this database has no backup of any kind."
            exit 1
          fi

      # The server is PostgreSQL 17. pg_dump refuses to dump a server newer
      # than itself, and the runner image ships an older client, so the version
      # is pinned explicitly rather than left to whatever the image happens to
      # have this month.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - uses: actions/checkout@v4
        with:
          sparse-checkout: certs

      - name: Dump, encrypt, upload
        env:
          # The session pooler (5432), not the transaction pooler: pg_dump
          # needs a stable session. Not db.<ref>.supabase.co either — that
          # host is IPv6-only and this runner has no IPv6.
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          FILE="meatshop-${STAMP}.dump"

          # --schema=public --schema=auth, NOT the whole database.
          #
          # A full dump was tried and does not restore: it carries Supabase's
          # managed schemas (vault, storage, realtime, extensions) which depend
          # on roles and extensions that only Supabase's own provisioning
          # creates. Measured on 2026-08-10 — restoring a full dump into a
          # clean PostgreSQL 17 produced 274 errors, beginning with
          # `relation "vault.secrets" does not exist`. The scoped dump restored
          # with exit 0 and zero errors.
          #
          # public = this application's data. auth = Supabase Auth users, i.e.
          # customer accounts. Everything excluded is infrastructure that a new
          # Supabase project recreates for itself.
          #
          # Note that Supabase Storage OBJECTS are not in Postgres at all, so
          # they are not in this dump. Product images live there; they are
          # reproducible from the source images and are not customer data.
          #
          # --format=custom so a restore can be selective and parallel, which
          # matters when you are restoring under pressure.
          # PGSSLROOTCERT pins Supabase's own root; without it libpq cannot
          # verify the chain, and the usual workaround (sslmode=require) does
          # not verify anything at all.
          PGSSLROOTCERT=certs/supabase-prod-ca-2021.crt \
          pg_dump "${DIRECT_DATABASE_URL}?sslmode=verify-full" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --file="$FILE"

          ls -lh "$FILE"

          # The dump contains customers' names, addresses and phone numbers.
          # It is going to a third party's disk, so it is encrypted before it
          # leaves this runner rather than trusting bucket permissions alone.
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$PASSPHRASE" --output "$FILE.gpg" "$FILE"
          rm -f "$FILE"

          # NOTE: the dump is never uploaded as a workflow artifact. This
          # repository is public, and artifacts of a public repository are
          # downloadable by anyone. That would publish the customer database.
          aws s3 cp "$FILE.gpg" "s3://$BUCKET/postgres/$FILE.gpg" \
            --endpoint-url "$ENDPOINT" --only-show-errors
          echo "Uploaded postgres/$FILE.gpg"

      - name: Prune dumps older than 14 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          # 14 days, not one rolling copy. The failure you actually have to
          # recover from is usually corruption noticed late, and a single
          # rolling copy will have faithfully overwritten itself with the
          # corrupted state long before anyone looks.
          CUTOFF=$(date -u -d '14 days ago' +%Y-%m-%d)
          aws s3 ls "s3://$BUCKET/postgres/" --endpoint-url "$ENDPOINT" \
            | awk '{print $1" "$4}' \
            | while read -r d key; do
                [ -z "$key" ] && continue
                if [[ "$d" < "$CUTOFF" ]]; then
                  aws s3 rm "s3://$BUCKET/postgres/$key" --endpoint-url "$ENDPOINT" --only-show-errors
                  echo "pruned $key"
                fi
              done

      # A dead-man's switch, and the only part of this file that can detect the
      # failure mode that matters: the workflow not running at all.
      #
      # Every check above fails loudly. None of them fires if the schedule
      # stops — GitHub disables scheduled workflows on repositories with no
      # activity for 60 days, and a paused Supabase project produces no
      # notification either. So success pings an external monitor configured to
      # alert a PHONE if the ping does not arrive within 8 hours.
      #
      # Runs only on success, on purpose: a failed dump must NOT check in.
      - name: Check in with the backup monitor
        if: success()
        env:
          PING_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "::error::BACKUP_HEARTBEAT_URL is not set. The dump ran, but nothing"
            echo "is watching for it to STOP running. On this infrastructure that is"
            echo "the difference between a 6-hour RPO and no backup at all."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 "$PING_URL"
