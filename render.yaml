# ⚠⚠ THIS FILE IS NOT IN EFFECT. IT CONFIGURES NOTHING. ⚠⚠
#
# Blueprints (infrastructure-as-code, i.e. this file) are a PAID Render
# feature; the workspace is on Hobby. The web service was therefore created by
# hand in the dashboard, and Render never reads this file. **The dashboard is
# the source of truth for every value below.**
#
# It is kept, rather than deleted, for two reasons: it is the written record of
# what the dashboard should say, and it becomes live unchanged the day the
# workspace is on a paid plan.
#
# ⚠ THE FAILURE MODE THIS CREATES: edit this file, believe you changed the
# deployment, and you have changed nothing. **Change the dashboard first, then
# mirror it here in the same commit.** If the two ever disagree, the dashboard
# is right and this file is the bug.
#
# ── Render service definition (mirror of the dashboard) ──────────────
#
# Render connects to THIS repository directly (root directory `/`), not to the
# private parent repo — so documentation commits never trigger a rebuild.
#
# Region: US-East (Ohio/Virginia). Render has no Canadian region; the database
# sits in Supabase ca-central-1, so the app runs in the US and the customer
# data stays in Canada. Measure the round trip before relying on it.
#
# Migrations do NOT run here. They run from a CI job: Render's pre-deploy
# command is documented as paid-instances-only, and running migrations at app
# startup would race two app versions during a health-check-gated deploy.

services:
  - type: web
    name: online-meat-shop
    runtime: node
    region: ohio
    # FREE FOR NOW — deliberately, and temporarily. Change this one line to
    # `starter` (and nothing else) before the shop takes a real order.
    #
    # What `free` costs, so the next session does not rediscover it:
    #   - The instance SPINS DOWN after 15 minutes without traffic, and the
    #     next request waits ~1 minute for it to come back. Fine while the only
    #     visitors are us and the client; not fine for a customer mid-checkout.
    #   - 750 free instance-hours per calendar month, workspace-wide.
    #   - No zero-downtime deploys: a deploy is a short outage, not a handover.
    #   - Ephemeral filesystem, no persistent disk, no SSH, no one-off jobs.
    #     None of these are used — the state is all in Postgres.
    #   - Pre-deploy commands stay unavailable, which changes nothing:
    #     migrations already run from CI (see the note at the top of this file).
    #
    # ⚠ THE ONE THING THAT BREAKS ON FREE is the in-process scheduler
    # (`src/jobs/scheduler.ts`, D11): it can only run while the process is
    # awake, and a spun-down process runs nothing. Nothing calls it yet, so
    # this is latent rather than broken — but the outbox drain and the stale-
    # attempt sweeper cannot be trusted until this is `starter`.
    plan: free
    branch: main
    # `--include=dev` IS LOAD-BEARING. NODE_ENV=production is set below (correct
    # for the runtime), and npm treats that as an implicit `--omit=dev`. Without
    # the flag, `npm ci` skips devDependencies — typescript, @types/*,
    # eslint-config-next — and `next build` fails on a TypeScript project that
    # has no TypeScript. The error names a missing module, not the env var, so
    # it reads as a broken lockfile and is not one.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz

    # RENDER NEVER DEPLOYS ON ITS OWN. Deploys arrive from the deploy hook at
    # the end of .github/workflows/deploy.yml, which runs only after CI is
    # green and the migrations have applied.
    #
    # `autoDeployTrigger: commit` (the deprecated `autoDeploy: true`) would
    # deploy every push immediately, racing the CI run and the migration job
    # rather than waiting for them — which is the same defect the deploy
    # workflow was just fixed to avoid. Leave this off.
    autoDeployTrigger: off

    envVars:
      - key: NODE_VERSION
        value: '24'
      # Runtime only. See the build command above — this is why it needs
      # `--include=dev`.
      - key: NODE_ENV
        value: production
      # Every secret below is set in the Render dashboard, never in this file.
      # This repository is public.
      #
      # DIRECT_DATABASE_URL is deliberately ABSENT. It bypasses the connection
      # pooler and is needed only by the migration job and the backup dump —
      # both of which run elsewhere. Giving it to the web runtime would widen
      # credential exposure and let application code sidestep the pool.
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MONERIS_STORE_ID
        sync: false
      - key: MONERIS_API_TOKEN
        sync: false
      - key: MONERIS_ENV
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # 🔴 ADDED TO THE DASHBOARD 2026-08-18, AND IT IS LOAD-BEARING.
      # The app's own origin, e.g. https://<service>.onrender.com. Without it
      # `portalOrigin()` is null and every dispatch SMS goes out with the
      # driver's sign-in link SILENTLY OMITTED — which it did, in production,
      # for a day. `sync: false` because it changes when the real domain
      # arrives, not because it is a secret.
      #
      # ⚠ ALSO BAKED INTO THE BUILD. robots.txt and sitemap.xml are
      # prerendered, so changing this value needs a REDEPLOY and not just a
      # restart, or the SEO surfaces keep pointing at example.invalid.
      - key: NEXT_PUBLIC_SITE_ORIGIN
        sync: false
      # The remaining presentation variables (NEXT_PUBLIC_SHOP_NAME, the shop's
      # own address, DELIVERY_TOWNS, SHOP_OPENING_HOURS) are documented in
      # `.env.example` and are NOT listed here, because this file mirrors what
      # the dashboard actually has and they are not set yet. Unset, each shows
      # a deliberately implausible fallback — the site currently calls itself
      # "Test Butcher Ltd".
      - key: SHOP_TIMEZONE
        sync: false
      - key: SHOP_CURRENCY
        value: CAD
      - key: WEIGHT_TOLERANCE
        value: '0.10'
